<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin — Memeless</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧠</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-0: #0a0a0b;
            --bg-1: #111113;
            --bg-2: #1a1a1d;
            --bg-3: #222226;
            --bg-4: #2a2a2f;
            --border: #2e2e33;
            --border-hover: #3e3e44;
            --text: #ececec;
            --text-dim: #888890;
            --text-faint: #55555a;
            --correct: #3fb950;
            --correct-dim: rgba(63, 185, 80, 0.12);
            --incorrect: #f85149;
            --incorrect-dim: rgba(248, 81, 73, 0.12);
            --radius: 20px;
            --radius-sm: 14px;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg-0);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            width: 100%;
            max-width: 640px;
            margin: 0 auto;
        }

        .hidden {
            display: none !important;
        }

        .card {
            background: var(--bg-1);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 24px;
            margin-top: 20px;
        }

        .card h2 {
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 16px;
        }

        .form-group {
            margin-bottom: 14px;
        }

        .form-group label {
            display: block;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-dim);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }

        .form-group input {
            width: 100%;
            padding: 12px 14px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
            background: var(--bg-2);
            color: var(--text);
            font-size: 0.95rem;
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s, background 0.2s;
        }

        .form-group input:focus {
            border-color: var(--border-hover);
            background: var(--bg-3);
        }

        .btn {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: var(--radius-sm);
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.15s ease;
            font-family: inherit;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-primary {
            background: var(--bg-3);
            color: var(--text);
            border: 1px solid var(--border-hover);
        }

        .btn-primary:hover:not(:disabled) {
            background: var(--bg-4);
            border-color: var(--text-faint);
        }

        .btn-primary:active:not(:disabled) {
            transform: scale(0.98);
        }

        .btn-danger {
            background: transparent;
            color: var(--incorrect);
            border: 1px solid var(--incorrect);
        }

        .btn-danger:hover:not(:disabled) {
            background: var(--incorrect-dim);
        }

        .btn-success {
            background: transparent;
            color: var(--correct);
            border: 1px solid var(--correct);
        }

        .btn-success:hover:not(:disabled) {
            background: var(--correct-dim);
        }

        .btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            transform: none !important;
        }

        .btn-row {
            display: flex;
            gap: 10px;
            margin-top: 16px;
        }

        .btn-row .btn {
            flex: 1;
        }

        .status-msg {
            text-align: center;
            margin-top: 12px;
            font-size: 0.9rem;
            font-weight: 600;
            display: none;
        }

        .status-msg.error {
            display: block;
            color: var(--incorrect);
        }

        .status-msg.success {
            display: block;
            color: var(--correct);
        }

        .queue-item {
            background: var(--bg-0);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 16px;
            margin-bottom: 12px;
        }

        .queue-item-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 10px;
            gap: 10px;
        }

        .queue-filename {
            font-weight: 700;
            font-size: 0.95rem;
            word-break: break-all;
        }

        .queue-time {
            font-size: 0.75rem;
            color: var(--text-faint);
            font-weight: 500;
            white-space: nowrap;
        }

        .queue-video {
            width: 100%;
            border-radius: var(--radius-sm);
            background: var(--bg-2);
            margin-bottom: 12px;
        }

        .empty-queue {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-faint);
            font-weight: 500;
        }

        .loading-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            padding: 40px 20px;
            color: var(--text-faint);
            font-weight: 500;
        }

        .loading-dots {
            display: flex;
            gap: 4px;
        }

        .loading-dots span {
            width: 6px;
            height: 6px;
            background: var(--text-faint);
            border-radius: 50%;
            animation: dotPulse 1.2s infinite ease-in-out;
        }

        .loading-dots span:nth-child(2) { animation-delay: 0.15s; }
        .loading-dots span:nth-child(3) { animation-delay: 0.3s; }

        @keyframes dotPulse {
            0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
            40% { transform: scale(1); opacity: 1; }
        }

        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
        }

        .header-row h1 {
            font-size: 1.3rem;
            font-weight: 800;
        }

        .logout-btn {
            background: transparent;
            color: var(--text-dim);
            border: 1px solid var(--border);
            padding: 8px 14px;
            border-radius: var(--radius-sm);
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
        }

        .logout-btn:hover {
            border-color: var(--border-hover);
            color: var(--text);
        }

        @media (max-width: 480px) {
            body { padding: 12px; }
            .card { padding: 16px; }
            .btn-row { flex-direction: column; }
            .btn-row .btn { width: 100%; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header-row">
            <h1>Meme Submissions</h1>
            <button class="logout-btn hidden" id="logout-btn">Logout</button>
        </div>

        <!-- Login -->
        <div class="card" id="login-card">
            <h2>Admin Login</h2>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="login-email" autocomplete="email" />
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="login-password" autocomplete="current-password" />
            </div>
            <button class="btn btn-primary" id="login-btn" style="width: 100%;">Login</button>
            <div class="status-msg" id="login-status"></div>
        </div>

        <!-- Queue -->
        <div class="card hidden" id="queue-card">
            <div id="queue-list"></div>
            <div class="empty-queue hidden" id="empty-queue">No pending submissions.</div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://irvyihmyrdxrjhbepshv.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_YSvGNFDTf7RrmRD3gTeOfw_vITAYU0e";
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const els = {
            loginCard: document.getElementById("login-card"),
            queueCard: document.getElementById("queue-card"),
            loginBtn: document.getElementById("login-btn"),
            loginEmail: document.getElementById("login-email"),
            loginPassword: document.getElementById("login-password"),
            loginStatus: document.getElementById("login-status"),
            queueList: document.getElementById("queue-list"),
            emptyQueue: document.getElementById("empty-queue"),
            logoutBtn: document.getElementById("logout-btn")
        };

        let currentUser = null;

        async function checkSession() {
            const { data } = await supabaseClient.auth.getSession();
            if (data.session) {
                currentUser = data.session.user;
                await verifyAdmin();
            }
        }

        async function verifyAdmin() {
            const { data, error } = await supabaseClient
                .from("admins")
                .select("user_id")
                .eq("user_id", currentUser.id)
                .single();

            if (error || !data) {
                showLogin("Not authorized as admin.");
                return;
            }

            showQueue();
        }

        function showLogin(msg) {
            els.loginCard.classList.remove("hidden");
            els.queueCard.classList.add("hidden");
            els.logoutBtn.classList.add("hidden");
            if (msg) {
                els.loginStatus.textContent = msg;
                els.loginStatus.className = "status-msg error";
            }
        }

        function showQueue() {
            els.loginCard.classList.add("hidden");
            els.queueCard.classList.remove("hidden");
            els.logoutBtn.classList.remove("hidden");
            loadQueue();
        }

        async function loadQueue() {
            els.queueList.innerHTML = `
                <div class="loading-state">
                    <div class="loading-dots">
                        <span></span>
                        <span></span>
                        <span></span>
                    </div>
                    <div>Loading queue...</div>
                </div>
            `;
            els.emptyQueue.classList.add("hidden");

            const { data, error } = await supabaseClient
                .from("submissions")
                .select("*")
                .eq("status", "pending")
                .order("created_at", { ascending: false });

            if (error) {
                els.queueList.innerHTML = `<div class="status-msg error">Failed to load queue.</div>`;
                return;
            }

            if (!data || data.length === 0) {
                els.queueList.innerHTML = "";
                els.emptyQueue.classList.remove("hidden");
                return;
            }

            els.queueList.innerHTML = "";
            for (const item of data) {
                const div = document.createElement("div");
                div.className = "queue-item";
                div.dataset.id = item.id;
                div.dataset.path = item.storage_path;
                div.dataset.filename = item.original_filename;

                const time = new Date(item.created_at).toLocaleString();
                div.innerHTML = `
                    <div class="queue-item-header">
                        <div class="queue-filename">${escapeHtml(item.original_filename)}</div>
                        <div class="queue-time">${time}</div>
                    </div>
                    <video class="queue-video" controls preload="metadata"></video>
                    <div class="btn-row">
                        <button class="btn btn-danger delete-btn">Delete</button>
                        <button class="btn btn-success confirm-btn">Confirm</button>
                    </div>
                `;

                const video = div.querySelector(".queue-video");
                try {
                    const { data: blob } = await supabaseClient.storage
                        .from("memeless-submissions")
                        .download(item.storage_path);
                    if (blob) {
                        video.src = URL.createObjectURL(blob);
                    }
                } catch (err) {
                    console.error("Failed to load video", err);
                }

                div.querySelector(".delete-btn").addEventListener("click", () => deleteSubmission(item.id, item.storage_path, div));
                div.querySelector(".confirm-btn").addEventListener("click", () => confirmSubmission(item.id, item.storage_path, item.original_filename, div));

                els.queueList.appendChild(div);
            }
        }

        async function deleteSubmission(id, path, domItem) {
            if (!confirm("Are you sure you want to delete this meme?")) return;

            domItem.querySelector(".delete-btn").disabled = true;
            domItem.querySelector(".confirm-btn").disabled = true;

            try {
                const { error: storageError } = await supabaseClient.storage
                    .from("memeless-submissions")
                    .remove([path]);

                if (storageError) throw storageError;

                const { error: dbError } = await supabaseClient
                    .from("submissions")
                    .delete()
                    .eq("id", id);

                if (dbError) throw dbError;

                domItem.remove();
                if (els.queueList.children.length === 0) {
                    els.emptyQueue.classList.remove("hidden");
                }
            } catch (err) {
                console.error(err);
                alert("Failed to delete submission. Please try again.");
                domItem.querySelector(".delete-btn").disabled = false;
                domItem.querySelector(".confirm-btn").disabled = false;
            }
        }

        async function confirmSubmission(id, path, filename, domItem) {
            const delBtn = domItem.querySelector(".delete-btn");
            const confBtn = domItem.querySelector(".confirm-btn");
            delBtn.disabled = true;
            confBtn.disabled = true;

            const video = domItem.querySelector(".queue-video");
            const safeName = sanitizeFilename(filename);
            const baseName = safeName.toLowerCase().endsWith(".mp4")
                ? safeName.slice(0, -4)
                : safeName;

            try {
                confBtn.textContent = "Processing...";

                const { data: mp4Blob, error: downloadError } = await supabaseClient.storage
                    .from("memeless-submissions")
                    .download(path);

                if (downloadError) throw downloadError;

                downloadBlob(mp4Blob, baseName + ".mp4");

                const jpgBlob = await generateJpgFromBlob(mp4Blob);
                downloadBlob(jpgBlob, baseName + ".jpg");

                const { error: storageError } = await supabaseClient.storage
                    .from("memeless-submissions")
                    .remove([path]);

                if (storageError) throw storageError;

                const { error: dbError } = await supabaseClient
                    .from("submissions")
                    .delete()
                    .eq("id", id);

                if (dbError) throw dbError;

                domItem.remove();
                if (els.queueList.children.length === 0) {
                    els.emptyQueue.classList.remove("hidden");
                }
            } catch (err) {
                console.error(err);
                alert("Failed to process meme. Please try again. The submission remains pending.");
                confBtn.textContent = "Confirm";
                delBtn.disabled = false;
                confBtn.disabled = false;
            }
        }

        function generateJpgFromBlob(mp4Blob) {
            return new Promise((resolve, reject) => {
                const video = document.createElement("video");
                video.muted = true;
                video.preload = "metadata";
                const url = URL.createObjectURL(mp4Blob);
                video.src = url;

                video.onloadedmetadata = () => {
                    const dur = video.duration || 0;
                    const target = Math.max(0.1, Math.min(dur * 0.5, dur - 0.1));
                    video.currentTime = isFinite(target) ? target : 0.5;
                };

                video.onseeked = () => {
                    try {
                        const canvas = document.createElement("canvas");
                        canvas.width = video.videoWidth || 640;
                        canvas.height = video.videoHeight || 360;
                        const ctx = canvas.getContext("2d");
                        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                        canvas.toBlob((blob) => {
                            URL.revokeObjectURL(url);
                            if (blob) {
                                resolve(blob);
                            } else {
                                reject(new Error("Failed to generate JPG"));
                            }
                        }, "image/jpeg", 0.92);
                    } catch (e) {
                        URL.revokeObjectURL(url);
                        reject(e);
                    }
                };

                video.onerror = () => {
                    URL.revokeObjectURL(url);
                    reject(new Error("Failed to load video for JPG generation"));
                };
            });
        }

        function downloadBlob(blob, filename) {
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            setTimeout(() => URL.revokeObjectURL(url), 1000);
        }

        function sanitizeFilename(name) {
            return name
                .replace(/[\/\\:*?"<>|]/g, "_")
                .replace(/\s+/g, " ")
                .trim()
                .slice(0, 200);
        }

        function escapeHtml(str) {
            return str
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;");
        }

        els.loginBtn.addEventListener("click", async () => {
            const email = els.loginEmail.value.trim();
            const password = els.loginPassword.value.trim();

            if (!email || !password) {
                els.loginStatus.textContent = "Please enter email and password.";
                els.loginStatus.className = "status-msg error";
                return;
            }

            els.loginBtn.disabled = true;
            els.loginStatus.className = "status-msg";
            els.loginStatus.textContent = "";

            const { data, error } = await supabaseClient.auth.signInWithPassword({
                email,
                password
            });

            if (error) {
                els.loginStatus.textContent = "Invalid credentials.";
                els.loginStatus.className = "status-msg error";
                els.loginBtn.disabled = false;
                return;
            }

            currentUser = data.user;
            await verifyAdmin();
        });

        els.logoutBtn.addEventListener("click", async () => {
            await supabaseClient.auth.signOut();
            currentUser = null;
            els.loginCard.classList.remove("hidden");
            els.queueCard.classList.add("hidden");
            els.logoutBtn.classList.add("hidden");
            els.loginEmail.value = "";
            els.loginPassword.value = "";
            els.loginBtn.disabled = false;
            els.loginStatus.className = "status-msg";
            els.loginStatus.textContent = "";
        });

        checkSession();
    </script>
</body>
</html>
